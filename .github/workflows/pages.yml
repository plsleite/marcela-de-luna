# Publica a pasta site/ no GitHub Pages a cada push no main (ou à mão), depois dos testes.
# O Pages só publica direto da raiz ou de /docs; daí o fluxo. Ações oficiais nas versões principais
# atuais (conferidas em 15/11/2026).
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Uma publicação por vez; a que está em andamento termina.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs

  publicar:
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: publicacao
        uses: actions/deploy-pages@v5
